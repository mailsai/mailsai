name: secret-scan

# This repository is the PUBLIC mirror of a private one that holds a directory at
# the same internal path (packages/mcp-server). The mirror is updated by hand, so
# the update gesture is "copy files across" between two near-identical trees. This
# runs on every push and pull request so a wrong source directory is caught here
# rather than after it is public.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole history, not just the tip commit
      - name: Prove the scanner still has teeth
        run: ./scripts/secret-scan.test.sh
      - name: Scan the tree
        run: ./scripts/secret-scan.sh
